# fly.toml for arden-hub (https://arden-hub.fly.dev)
# Deploy with --ha=false: history is a file on one volume, one writer.

app = 'arden-hub'
primary_region = 'iad'

[env]
  DATA_DIR = '/data'
  PORT = '8080'
  TZ = 'America/New_York'

[[mounts]]
  source = 'hub_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
