<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staging Lane Health - Panel</title>
<link rel="stylesheet" href="/web/board2.css">
<style>
  /* Panels built for one quadrant of a 1080p wall panel: 958 x 511 real
     pixels, seen from across a warehouse floor. Everything here is sized for
     that and nothing else. The ordinary pages are dense because they are read
     at a desk with a mouse; shrinking one of those into a quarter of a screen
     gives eight point type on a sixty-five inch display, which is a picture of
     information rather than information. So these are built at the size they
     will be shown at, with no scaling and no scrollbars, and they show fewer
     things larger.

     ?p=productivity  who is picking and how they are doing against standard
     ?p=pace          how the day has gone hour by hour, against the standard

     Both are also perfectly good on their own at /panel?p=pace, which is what
     a spare monitor by a desk wants. */
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--surface); color:var(--ink); }
  body{ font:14px/1.3 "Segoe UI", system-ui, sans-serif; }
  .p{ display:flex; flex-direction:column; height:100vh; padding:10px 14px 8px; box-sizing:border-box; }
  .ph{ display:flex; align-items:baseline; gap:12px; flex:0 0 auto; margin-bottom:6px; }
  .ph .t{ font-size:15px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
  .ph .s{ font-size:14px; color:var(--ink-2); font-weight:600; }
  .ph .r{ margin-left:auto; font-size:13px; color:var(--muted); }

  /* the three numbers that answer the panel at a glance */
  .nums{ display:flex; gap:10px; flex:0 0 auto; margin-bottom:8px; }
  .n{ flex:1; background:var(--tile); border:1px solid var(--ring); border-radius:7px; padding:6px 12px 7px; min-width:0; }
  .n .k{ font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .n .v{ font-size:36px; font-weight:700; line-height:1.05; font-variant-numeric:tabular-nums; }
  .n .v small{ font-size:17px; color:var(--ink-2); font-weight:600; }
  .n .v.good{ color:var(--good); } .n .v.warn{ color:#8a5a00; } .n .v.bad{ color:var(--crit); }

  /* productivity: one row a picker, the bar is percent of standard */
  .rows{ flex:1 1 auto; display:flex; flex-direction:column; gap:3px; min-height:0; overflow:hidden; }
  .r{ display:grid; grid-template-columns:150px 1fr 62px 74px; gap:10px; align-items:center;
      font-size:17px; line-height:1; padding:3px 0; }
  .r .who{ font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .r .track{ position:relative; height:19px; background:var(--blue-soft); border-radius:3px; overflow:hidden; }
  .r .track i{ position:absolute; left:0; top:0; bottom:0; background:var(--blue); }
  .r .track i.good{ background:var(--good); } .r .track i.warn{ background:var(--amber); } .r .track i.bad{ background:var(--crit); }
  /* where standard sits on the shared scale, so a row can be read against it */
  .r .track u{ position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--ink); opacity:.55; }
  .r .pct{ text-align:right; font-weight:800; font-variant-numeric:tabular-nums; }
  .r .pct.good{ color:var(--good); } .r .pct.warn{ color:#8a5a00; } .r .pct.bad{ color:var(--crit); }
  .r .sub{ text-align:right; font-size:14px; color:var(--ink-2); font-variant-numeric:tabular-nums; }
  .rh{ display:grid; grid-template-columns:150px 1fr 62px 74px; gap:10px;
       font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
       border-bottom:1px solid var(--axis); padding-bottom:3px; margin-bottom:3px; }
  .rh span:nth-child(3), .rh span:nth-child(4){ text-align:right; }
  .more{ font-size:13px; color:var(--muted); padding-top:3px; }

  /* pace: an hour a bar, with the crew's percent of standard over it */
  .chart{ flex:1 1 auto; min-height:0; position:relative; }
  svg.pc{ width:100%; height:100%; display:block; }
  svg.pc .grid{ stroke:var(--hair); stroke-width:1; }
  svg.pc .std{ stroke:var(--ink); stroke-width:1.5; stroke-dasharray:5 4; opacity:.55; }
  svg.pc text{ font:600 12px "Segoe UI", system-ui, sans-serif; fill:var(--muted); }
  svg.pc text.hr{ font-size:13px; }
  svg.pc text.val{ font-weight:800; font-size:13px; }
  .legend{ flex:0 0 auto; display:flex; gap:16px; font-size:13px; color:var(--ink-2); padding-top:4px; align-items:center; }
  .legend i{ display:inline-block; width:14px; height:10px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  .empty{ flex:1; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--ink-2); font-size:18px; padding:20px; }
</style>
</head>
<body>
<div class="p" id="p"><div class="empty">loading</div></div>
<script src="/web/theme.js"></script>
<script>
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const WHICH = Q.get('p') === 'pace' ? 'pace' : 'productivity';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
function tone(p){ return p == null ? '' : p >= 100 ? 'good' : p >= 90 ? 'warn' : 'bad'; }
function hhmm(h){
  const t = Math.max(0, h) % 24, m = Math.round((t % 1) * 60);
  return String(Math.floor(t)).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}
let REP = null, BOARD = null;

/* What window the numbers cover, in clock time. Both panels count the shift
   that is running, which is not always the same thing as today: a shift that
   began before midnight carries its own first hours with it. The classic
   board counts the calendar day instead, so the two disagree by exactly
   those hours - and with no window on screen there was no way to see that
   from the numbers. Now there is. */
function windowOf(){
  if(!REP || !REP.live) return 'today';
  return REP.live.label + ' · ' + hhmm(REP.live.start) + ' to now';
}

/* ---------------- productivity ----------------
   Everyone picking on the shift that is running, hardest worker at the top,
   with the bar drawn against a scale the whole panel shares so two rows can
   be compared by eye. The mark on each bar is standard, so "am I ahead" is
   answered without reading a number. */
function drawProductivity(){
  const p = $('p');
  const people = (REP && REP.people) || [];
  if(!people.length){
    p.innerHTML = head('Productivity', 'nobody picking yet') +
      '<div class="empty">No confirmations on this shift yet.<br>Rows appear as people scan.</div>';
    return;
  }
  const t = REP.summary || {};
  const crewPct = (t.pct != null) ? t.pct : null;
  /* one scale for every bar, with room above standard so beating it shows as
     beating it rather than as a full bar like everyone else's */
  let top = 100;
  people.forEach(x => { if(x.pct != null && x.pct > top) top = x.pct; });
  top = Math.max(120, top * 1.05);

  const fits = Math.max(4, Math.floor((511 - 150) / 28));
  const show = people.slice(0, fits);
  p.innerHTML = head('Productivity', windowOf()) +
    '<div class="nums">' +
      num('Crew vs standard', crewPct == null ? '--' : crewPct + '<small>%</small>', tone(crewPct)) +
      num('Picks this shift', (t.picks || 0).toLocaleString()) +
      num('Picking now', people.length) +
      num('Active hours', (t.hours || 0).toFixed(1)) +
    '</div>' +
    '<div class="rh"><span>Picker</span><span>Percent of standard</span><span>%</span><span>Picks</span></div>' +
    '<div class="rows">' + show.map(x => {
      const cls = tone(x.pct);
      const w = Math.max(1, Math.min(100, ((x.pct || 0) / top) * 100));
      return '<div class="r"><span class="who">' + esc(x.who) + '</span>' +
        '<span class="track"><i class="' + cls + '" style="width:' + w.toFixed(1) + '%"></i>' +
          '<u style="left:' + ((100 / top) * 100).toFixed(1) + '%"></u></span>' +
        '<span class="pct ' + cls + '">' + (x.pct == null ? '--' : x.pct) + '</span>' +
        '<span class="sub">' + x.total.toLocaleString() + '</span></div>';
    }).join('') + '</div>' +
    (people.length > show.length ? '<div class="more">+' + (people.length - show.length) + ' more on the picker report</div>' : '');
}

/* ---------------- pace ----------------
   The day so far, an hour at a time: how many picks the crew put away and
   how that hour ran against standard. The question a supervisor asks walking
   past is "are we behind, and since when", and an hour is the grain that
   answers it - a day total hides the hour it went wrong. */
function drawPace(){
  const p = $('p');
  const s = (REP && REP.series) || null;
  const hours = (s && s.by === 'hour') ? s.x : [];
  const crew = (s && s.crew) || [];
  const live = REP && REP.live;
  if(!hours.length){
    p.innerHTML = head('Pace', windowOf()) +
      '<div class="empty">No hours with picks in them yet.</div>';
    return;
  }
  const t = REP.summary || {};
  const crewPct = (t.pct != null) ? t.pct : null;
  const done = crew.filter(Boolean);
  const best = done.reduce((b, c) => (b == null || c.picks > b) ? c.picks : b, null) || 1;
  /* the last hour with work in it, which is the one somebody can still act on */
  const last = (() => { for(let i = crew.length - 1; i >= 0; i--) if(crew[i]) return { h: hours[i], c: crew[i] }; return null; })();
  const cleared = (BOARD && BOARD.pace) ? BOARD.pace.totesClearedToday : null;

  const W = 920, H = 250, padL = 4, padB = 26, padT = 10;
  const bw = (W - padL) / hours.length;
  const y = v => padT + (1 - Math.max(0, v) / best) * (H - padT - padB);
  let bars = '', marks = '', pts = [];
  /* The first minutes of the shift, behind the bars. An hour is the grain
     here, so a twenty minute band is a slice of the 07:00 column rather
     than a band of its own - which is exactly what it is. Drawn because
     the thin first hour reads as nobody working otherwise, and the grey
     closed time before it is too quiet to notice on a wall panel. */
  /* The first minutes of the shift, marked on the axis rather than behind
     the bars. Drawn behind them it was invisible under a full first hour,
     which is the whole complaint: the grey closed time before the shift is
     already there and nobody sees it. A solid bar on the baseline cannot
     be covered by anything. An hour is the grain here, so a twenty minute
     band is a slice of the 07:00 column - which is what it is. */
  let setupRect = '';
  ((REP && REP.setup) || []).forEach(([a, b]) => {
    const i = hours.indexOf(Math.floor(a));
    if(i < 0) return;
    const x0 = padL + i * bw;
    const from = x0 + (a - Math.floor(a)) * bw, to = x0 + Math.min(1, b - Math.floor(a)) * bw;
    if(to - from < 1) return;
    const base = H - padB;
    setupRect += '<rect x="' + from.toFixed(1) + '" y="' + (base - 7).toFixed(1) + '" width="' + (to - from).toFixed(1) +
      '" height="7" fill="var(--serious)"></rect>' +
      '<line x1="' + to.toFixed(1) + '" x2="' + to.toFixed(1) + '" y1="' + padT + '" y2="' + base +
      '" stroke="var(--serious)" stroke-width="2" stroke-dasharray="4 3"></line>' +
      '<text class="hr" x="' + (to + 6).toFixed(1) + '" y="' + (base - 12) +
      '" text-anchor="start" fill="var(--serious)">setup ends</text>';
  });
  hours.forEach((h, i) => {
    const c = crew[i];
    const x = padL + i * bw;
    if(c){
      const yy = y(c.picks);
      const col = c.pct == null ? 'var(--blue)' : c.pct >= 100 ? 'var(--good)' : c.pct >= 90 ? 'var(--amber)' : 'var(--crit)';
      bars += '<rect x="' + (x + bw * 0.14).toFixed(1) + '" y="' + yy.toFixed(1) +
        '" width="' + (bw * 0.72).toFixed(1) + '" height="' + (H - padB - yy).toFixed(1) +
        '" rx="2" fill="' + col + '"></rect>';
      marks += '<text class="val" x="' + (x + bw / 2).toFixed(1) + '" y="' + (yy - 4).toFixed(1) +
        '" text-anchor="middle" fill="var(--ink-2)">' + c.picks + '</text>';
      if(c.pct != null) pts.push([x + bw / 2, c.pct]);
    }
    marks += '<text class="hr" x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 8) +
      '" text-anchor="middle">' + hhmm(h) + '</text>';
  });
  const base = '<line class="grid" x1="0" x2="' + W + '" y1="' + (H - padB) + '" y2="' + (H - padB) + '"></line>';

  p.innerHTML = head('Pace', windowOf() + (last ? ' · last full hour ' + hhmm(last.h) : '')) +
    '<div class="nums">' +
      num('Crew vs standard', crewPct == null ? '--' : crewPct + '<small>%</small>', tone(crewPct)) +
      num('Picks this shift', (t.picks || 0).toLocaleString()) +
      num('Last hour', last ? last.c.picks.toLocaleString() : '--', last ? tone(last.c.pct) : '') +
      num('Totes cleared', cleared == null ? '--' : cleared.toLocaleString()) +
    '</div>' +
    '<div class="chart"><svg class="pc" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" ' +
      'aria-label="picks each hour, coloured by percent of standard">' + base + bars + setupRect + marks + '</svg></div>' +
    '<div class="legend"><span><i style="background:var(--good)"></i>at or over standard</span>' +
      '<span><i style="background:var(--amber)"></i>within 10%</span>' +
      '<span><i style="background:var(--crit)"></i>under</span>' +
      '<span style="margin-left:auto">bar height is picks in that hour</span></div>';
}

function head(t, s){
  return '<div class="ph"><span class="t">' + t + '</span><span class="s">' + esc(s || '') + '</span>' +
    '<span class="r" id="stamp"></span></div>';
}
function num(k, v, cls){
  return '<div class="n"><div class="k">' + k + '</div><div class="v ' + (cls || '') + '">' + v + '</div></div>';
}

async function load(){
  try{
    const r = await fetch('/api/pickers?shift=live', { cache: 'no-store' });
    REP = await r.json();
    if(WHICH === 'pace'){
      try{ BOARD = await (await fetch('/api/board', { cache: 'no-store' })).json(); }catch(e){ BOARD = null; }
    }
  }catch(e){
    $('p').innerHTML = '<div class="empty">Cannot reach the service.<br>' + esc(e.message) + '</div>';
    return;
  }
  if(WHICH === 'pace') drawPace(); else drawProductivity();
  const st = $('stamp');
  if(st) st.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
